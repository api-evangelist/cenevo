openapi: 3.2.0
info:
  title: Labguru Manifest API
  description: 'Labguru API is a JSON / REST based API, get started by reviewing the documentation below or code samples.


    Join our dedicated Slack channel

    to be in direct contact with our API team and be informed about the latest updates.


    ***API introduction and overview***'
  version: v1
tags:
- name: Manifest
paths:
  /api/v1/manifests:
    get:
      summary: List the objects that have changed today
      tags:
      - Manifest
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: the default call is with page = 1
        schema:
          type: integer
      responses:
        '200':
          description: success
        '404':
          description: page not found
      operationId: getApiV1Manifests
      x-operation-id-source: derived
  /api/v1/manifests/{id}:
    delete:
      summary: Delete manifest
      tags:
      - Manifest
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: manifest id
        schema:
          type: integer
      responses:
        '204':
          description: no content
        '404':
          description: not found
      operationId: deleteApiV1ManifestsById
      x-operation-id-source: derived
