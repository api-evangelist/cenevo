openapi: 3.2.0
info:
  title: Cenevo Projects API
  version: '1.0'
  description: 'Operations tagged Projects across 2 of this provider''s published API definitions: cenevo-labguru-v1-openapi.yml, cenevo-labguru-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Projects
paths:
  /api/v1/projects:
    post:
      summary: Create a project
      tags:
      - Projects
      parameters: []
      responses:
        '201':
          description: project created
        '422':
          description: invalid request - Title can't be blank
        '401':
          description: 'Error: Unauthorized'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createProject'
        required: true
      operationId: postApiV1Projects
      x-operation-id-source: derived
    get:
      summary: List all projects in your account
      tags:
      - Projects
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: the default call is with page = 1
        schema:
          type: integer
      - name: meta
        in: query
        description: show summarized data information - true/false
        schema:
          type: string
      responses:
        '200':
          description: success
        '404':
          description: page not found
      operationId: getApiV1Projects
      x-operation-id-source: derived
  /api/v1/projects/{id}:
    put:
      summary: Update a project
      tags:
      - Projects
      parameters:
      - name: id
        in: path
        required: true
        description: project id
        schema:
          type: integer
      responses:
        '200':
          description: project updated
        '422':
          description: invalid request
        '401':
          description: 'Error: Unauthorized'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateProject'
        required: true
      operationId: putApiV1ProjectsById
      x-operation-id-source: derived
    get:
      summary: Get project by id
      tags:
      - Projects
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: project id
        schema:
          type: integer
      responses:
        '200':
          description: success
        '404':
          description: project not found
      operationId: getApiV1ProjectsById
      x-operation-id-source: derived
  /api/v2/projects/{id}:
    delete:
      summary: Delete project
      tags:
      - Projects
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: project id
        schema:
          type: integer
      responses:
        '204':
          description: no content
        '404':
          description: not found
      operationId: deleteApiV2ProjectsById
      x-operation-id-source: derived
components:
  schemas:
    createProject:
      allOf:
      - $ref: '#/components/schemas/ProjectBaseRequest'
      - type: object
        properties:
          item:
            type: object
            required:
            - title
    updateProject:
      allOf:
      - $ref: '#/components/schemas/ProjectBaseRequest'
    ProjectBaseRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          example: YOUR TOKEN IS HERE
        item:
          type: object
          properties:
            title:
              type: string
              description: The name of the project
            description:
              type: string
              description: Description of the project
            start_date:
              type: string
              format: date
              description: Start Date (yyyy-mm-dd)
            closed:
              type: boolean
              description: Archived/Active project flag
            status:
              type: string
              description: Status
            owner_id:
              type: integer
              description: 'ID of the owner (default: your member id)'
x-refined-from:
- cenevo-labguru-v1-openapi.yml
- cenevo-labguru-v2-openapi.yml
