openapi: 3.0.0
info:
  title: Labguru Antibodies Datasets API
  description: "Labguru API is a JSON / REST based API, get started by reviewing the documentation below or code samples.<br>\n        Join our dedicated [Slack channel](https://join.slack.com/t/labgurus/shared_invite/zt-199glfagl-QZQ_bKl7vLAi8CQSuNrRug)\n        to be in direct contact with our API team and be informed about the latest updates.<br>\n        ***[API introduction and overview](https://help.labguru.com/en/articles/6149483-api-introduction-and-overview)***"
  version: v1
tags:
- name: Datasets
paths:
  /api/v1/datasets:
    post:
      summary: Creates a dataset
      tags:
      - Datasets
      parameters: []
      responses:
        '201':
          description: dataset created
        '422':
          description: invalid request - data_attachment_id can't be blank
        '401':
          description: 'Error: Unauthorized'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createDataset'
        required: true
    get:
      summary: List all datasets in your account
      tags:
      - Datasets
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: the default call is with page = 1
        schema:
          type: integer
      - name: meta
        in: query
        description: ' show summarized data information - true/false'
        schema:
          type: string
      responses:
        '200':
          description: success
        '404':
          description: page not found
  /api/v1/datasets/{id}:
    get:
      summary: Get dataset by id
      tags:
      - Datasets
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: dataset id
        schema:
          type: integer
      responses:
        '200':
          description: success
        '404':
          description: page not found
    delete:
      summary: Delete dataset
      tags:
      - Datasets
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: dataset id
        schema:
          type: integer
      responses:
        '204':
          description: no content
        '404':
          description: not found
components:
  schemas:
    createDataset:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          example: YOUR TOKEN IS HERE
        item:
          type: object
          required:
          - name
          - data_attachment_id
          properties:
            name:
              type: string
              description: dataset name
            data_attachment_id:
              type: integer
              description: dataset attachment id
            sdf_attachment_id:
              type: integer
              description: SDF attachment id
            description:
              type: string
              description: dataset description
