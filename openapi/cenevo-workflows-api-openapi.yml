openapi: 3.2.0
info:
  title: Labguru Workflows API
  description: 'Labguru API is a JSON / REST based API, get started by reviewing the documentation below or code samples.


    Join our dedicated Slack channel

    to be in direct contact with our API team and be informed about the latest updates.


    ***API introduction and overview***'
  version: v1
tags:
- name: Workflows
paths:
  /api/v1/workflows/{id}:
    get:
      summary: Get workflow by id
      tags:
      - Workflows
      deprecated: true
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: workflow id
        schema:
          type: integer
      responses:
        '200':
          description: success
        '404':
          description: page not found
      operationId: getApiV1WorkflowsById
      x-operation-id-source: derived
    delete:
      summary: Delete workflow
      tags:
      - Workflows
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: workflow id
        schema:
          type: integer
      responses:
        '204':
          description: no content
        '404':
          description: not found
      operationId: deleteApiV1WorkflowsById
      x-operation-id-source: derived
  /api/v1/workflows:
    get:
      summary: List all workflows in your account
      tags:
      - Workflows
      deprecated: true
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: the default call is with page = 1
        schema:
          type: integer
      - name: meta
        in: query
        description: show summarized data information - true/false
        schema:
          type: string
      responses:
        '200':
          description: success
        '404':
          description: page not found
      operationId: getApiV1Workflows
      x-operation-id-source: derived
