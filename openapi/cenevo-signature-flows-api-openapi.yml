    Join our dedicated Slack channel

    to be in direct contact with our API team and be informed about the latest updates.


    ***API introduction and overview***'
  version: v1
tags:
- name: Signature flows
paths:
  /api/v1/signature_flows/{id}:
    delete:
      summary: Delete signature flow
      tags:
      - Signature flows
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: signature flow id
        schema:
          type: integer
      responses:
        '204':
          description: no content
        '404':
          description: not found
      operationId: deleteApiV1SignatureFlowsById
      x-operation-id-source: derived
