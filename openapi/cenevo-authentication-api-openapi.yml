openapi: 3.2.0
info:
  title: Labguru Authentication API
  description: 'Labguru API is a JSON / REST based API, get started by reviewing the documentation below or code samples.


    Join our dedicated Slack channel

    to be in direct contact with our API team and be informed about the latest updates.


    ***API introduction and overview***'
  version: v1
tags:
- name: Authentication
paths:
  /api/v1/sessions:
    post:
      summary: Create a token
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: token created
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createSession'
          application/xml:
            schema:
              $ref: '#/components/schemas/createSession'
        required: true
      operationId: postApiV1Sessions
      x-operation-id-source: derived
components:
  schemas:
    createSession:
      type: object
      required:
      - login
      - password
      properties:
        login:
          type: string
          description: E-mail
          example: labuser@email.com
        password:
          type: string
          description: password
        account_id:
          type: integer
          description: (optional) The account id to generate the token for
