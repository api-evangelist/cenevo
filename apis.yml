aid: cenevo
name: Cenevo
description: >-
  Cenevo is an AI-enabled lab automation company (the maker of Labguru and
  Mosaic, formerly BioData) that helps scientists, research institutions, and
  biopharmas connect and automate the laboratory. Its platform combines an
  electronic lab notebook / LIMS (Labguru), cloud-based sample management
  (Mosaic), AI agents, and 150+ instrument and system integrations to centralize
  lab data, automate repetitive workflows, and bring governed, auditable agentic
  intelligence into scientific research. Cenevo exposes the Labguru API, a JSON /
  REST API providing create, read, update, and delete access to almost all data
  in Labguru across antibodies, cell lines, compounds, experiments, inventory,
  storage, equipment, and more, with token-based authentication and webhook
  subscriptions. It is used by 950+ customers including 8 of the top 10
  biopharmas.
