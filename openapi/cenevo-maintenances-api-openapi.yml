openapi: 3.2.0
info:
  title: Labguru Maintenances API
  description: 'Labguru API is a JSON / REST based API, get started by reviewing the documentation below or code samples.


    Join our dedicated Slack channel

    to be in direct contact with our API team and be informed about the latest updates.


    ***API introduction and overview***'
  version: v1
tags:
- name: Maintenances
paths:
  /api/v1/maintenances:
    post:
      summary: Add maintenance to equipment
      tags:
      - Maintenances
      parameters: []
      responses:
        '201':
          description: maintenance created
        '401':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createMaintenance'
        required: true
      operationId: postApiV1Maintenances
      x-operation-id-source: derived
    get:
      summary: List all maintenances in your account
      tags:
      - Maintenances
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: the default call is with page = 1
        schema:
          type: integer
      - name: meta
        in: query
        description: ' show summarized data information - true/false'
        schema:
          type: string
      responses:
        '200':
          description: success
        '404':
          description: page not found
      operationId: getApiV1Maintenances
      x-operation-id-source: derived
  /api/v1/maintenances/{id}:
    put:
      summary: Update maintenance of equipment
      tags:
      - Maintenances
      parameters:
      - name: id
        in: path
        required: true
        description: maintenance id
        schema:
          type: integer
      responses:
        '200':
          description: maintenance updated
        '401':
          description: 'Error: Unauthorized'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateMaintenance'
        required: true
      operationId: putApiV1MaintenancesById
      x-operation-id-source: derived
    get:
      summary: Get maintenances by id
      tags:
      - Maintenances
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: maintenance id
        schema:
          type: integer
      responses:
        '200':
          description: success
        '404':
          description: maintenance not found
      operationId: getApiV1MaintenancesById
      x-operation-id-source: derived
    delete:
      summary: Delete maintenance
      tags:
      - Maintenances
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: maintenance id
        schema:
          type: integer
      responses:
        '204':
          description: no content
        '404':
          description: not found
      operationId: deleteApiV1MaintenancesById
      x-operation-id-source: derived
components:
  schemas:
    updateMaintenance:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          example: YOUR TOKEN IS HERE
        item:
          type: object
          required:
          - item_id
          properties:
            item_id:
              type: integer
              description: The ID of the equipment
            frequency_period:
              type: integer
              description: the time period in numbers
              example: '15'
            frequency_frame:
              type: string
              description: one of the following time frames - hour/day/week/month/year
              example: day
    createMaintenance:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          example: YOUR TOKEN IS HERE
        item:
          type: object
          required:
          - item_id
          - item_type
          - maintenance_type_id
          - frequency_period
          - frequency_frame
          properties:
            item_id:
              type: integer
              description: The ID of the equipment
            item_type:
              type: string
              description: the class of the item (System::Instrument)
              example: System::Instrument
            maintenance_type_id:
              type: integer
              description: The ID of the maintenance type
            frequency_period:
              type: integer
              description: the time period in numbers
              example: '1'
            frequency_frame:
              type: string
              description: one of the following time frames - hour/day/week/month/year
              example: year
