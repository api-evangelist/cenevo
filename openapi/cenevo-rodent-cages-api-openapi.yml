        '404':
          description: not found
      operationId: deleteApiV1RodentCagesById
      x-operation-id-source: derived
  /api/v2/rodent_cages:
    get:
      summary: List all rodent cages in your account
      tags:
      - Rodent cages
      description: List all rodent cages.
      parameters:
