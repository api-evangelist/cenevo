    post:
      summary: Creates a rodent cage
      tags:
      - Rodent cages
      description: Create a rodent cage.
      parameters: []
      responses:
        '200':
          description: OK
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
                    example: Name can't be blank
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createRodentCage'
        required: true
      operationId: postApiV1RodentCages
      x-operation-id-source: derived
    get:
      summary: List all rodent cages in your account
      tags:
      - Rodent cages
      deprecated: true
      description: 'List all rodent cages.


        **Note:** An improved version of this endpoint is available in API v2.

        Please visit API v2 docs.'
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: the default call is with page = 1
        schema:
          type: integer
      - name: meta
        in: query
