      x-operation-id-source: derived
components:
  schemas:
    updateRodentCage:
      allOf:
      - $ref: '#/components/schemas/RodentCageBaseRequest'
    RodentCageBaseRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          example: YOUR TOKEN IS HERE
        item:
          type: object
          properties:
            name:
              type: string
              description: The name of the Rodent cage
            breeding:
              type: boolean
              description: Breeding - by default it's true
            parent_id:
              type: integer
              description: The ID of the storage location
            description:
              type: string
              description: Detailed cage information
            owner_id:
              type: integer
              description: id of the owner - by default it's your member id
    Unauthorized:
      type: object
      properties:
        message:
          type: string
          example: You are not authorized to perform this action
    createRodentCage:
      allOf:
      - $ref: '#/components/schemas/RodentCageBaseRequest'
      - type: object
        properties:
          item:
            type: object
            required:
            - name
