openapi: 3.2.0
info:
  title: Labguru Companies API
  description: 'Labguru API is a JSON / REST based API, get started by reviewing the documentation below or code samples.


    Join our dedicated Slack channel

    to be in direct contact with our API team and be informed about the latest updates.


    ***API introduction and overview***'
  version: v1
tags:
- name: Companies
paths:
  /api/v1/companies:
    post:
      summary: Add a company
      tags:
      - Companies
      parameters: []
      responses:
        '200':
          description: company created
        '422':
          description: Title cannot be blank
        '401':
          description: 'Error: Unauthorized'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createCompany'
        required: true
      operationId: postApiV1Companies
      x-operation-id-source: derived
    get:
      summary: List all companies in your account
      tags:
      - Companies
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: the default call is with page = 1
        schema:
          type: integer
      - name: meta
        in: query
        description: ' show summarized data information - true/false'
        schema:
          type: string
      responses:
        '200':
          description: success
        '404':
          description: page not found
      operationId: getApiV1Companies
      x-operation-id-source: derived
  /api/v1/companies/{id}:
    put:
      summary: Update company attributes
      tags:
      - Companies
      parameters:
      - name: id
        in: path
        required: true
        description: company id
        schema:
          type: integer
      responses:
        '200':
          description: company updated
        '422':
          description: invalid request
        '401':
          description: 'Error: Unauthorized'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateCompany'
        required: true
      operationId: putApiV1CompaniesById
      x-operation-id-source: derived
    get:
      summary: Get company by id
      tags:
      - Companies
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: company id
        schema:
          type: integer
      responses:
        '200':
          description: success
        '404':
          description: company not found
      operationId: getApiV1CompaniesById
      x-operation-id-source: derived
    delete:
      summary: Delete company
      tags:
      - Companies
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: company id
        schema:
          type: integer
      responses:
        '204':
          description: no content
        '404':
          description: not found
      operationId: deleteApiV1CompaniesById
      x-operation-id-source: derived
components:
  schemas:
    updateCompany:
      allOf:
      - $ref: '#/components/schemas/CompanyBaseRequest'
    createCompany:
      allOf:
      - $ref: '#/components/schemas/CompanyBaseRequest'
      - type: object
        properties:
          item:
            type: object
            required:
            - name
    CompanyBaseRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          example: YOUR TOKEN IS HERE
        item:
          type: object
          properties:
            name:
              type: string
              description: the company name
            address:
              type: string
              description: address of the company
            web:
              type: string
              description: 'link to the company web page '
            contact:
              type: string
              description: 'contacts '
            email:
              type: string
              description: 'email '
            fax:
              type: string
              description: 'fax number '
            description:
              type: string
              description: 'general description '
